<!-- ============ 404 ============ -->
<section class="relative overflow-hidden bg-surface pt-28 pb-20 sm:pt-32 lg:pb-28">
  <!-- decorative background -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-32 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-primary/10 blur-3xl"></div>
    <div class="absolute top-1/3 -right-24 h-64 w-64 rounded-full bg-primary/5 blur-3xl"></div>
    <div class="absolute -bottom-24 -left-24 h-72 w-72 rounded-full bg-secondary/10 blur-3xl"></div>
  </div>

  <div class="relative mx-auto max-w-3xl px-4 text-center sm:px-6 lg:px-8">
    <!-- 404 -->
    <p
      aria-hidden="true"
      class="bg-linear-to-r from-primary-dark via-primary to-[#A85463] bg-clip-text font-display text-[88px] leading-none font-bold tracking-tight text-transparent sm:text-[128px] lg:text-[160px]"
    >
      404
    </p>

    <!-- shelf with a missing book -->
    <div class="mt-2 flex flex-col items-center" aria-hidden="true">
      <div class="flex h-24 items-end justify-center gap-1.5">
        <span class="h-14 w-4 rounded-t-sm bg-primary/25"></span>
        <span class="h-20 w-5 rounded-t-sm bg-primary/45"></span>
        <span class="h-12 w-4 rounded-t-sm bg-primary/20"></span>
        <span class="h-24 w-6 rounded-t-sm bg-primary"></span>
        <span class="h-16 w-4 rounded-t-sm bg-primary/30"></span>
        <!-- the gap -->
        <span class="h-24 w-6 rounded-sm border-2 border-dashed border-ink/20"></span>
        <span class="h-18 w-5 rounded-t-sm bg-primary/40"></span>
        <span class="h-11 w-4 rounded-t-sm bg-primary/20"></span>
        <span class="h-20 w-5 rounded-t-sm bg-primary/50"></span>
      </div>
      <div class="h-1.5 w-full max-w-xs rounded-full bg-ink/10"></div>
    </div>

    <!-- message -->
    <h1 class="mt-10 font-display text-3xl leading-tight font-bold text-ink sm:text-4xl">
      This page slipped off the shelf
    </h1>
    <p class="mx-auto mt-4 max-w-xl text-sm leading-relaxed text-ink/60 sm:text-base">
      The page you're looking for doesn't exist, was moved to another shelf, or never made it to
      print. Let's get you back to the good stuff.
    </p>

    <!-- actions -->
    <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a
        routerLink="/"
        class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-primary px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-dark focus:outline-none focus-visible:ring-4 focus-visible:ring-primary/30 sm:w-auto"
      >
        <i class="fa-solid fa-house" aria-hidden="true"></i>
        Back to home
      </a>
      <a
        routerLink="/books"
        class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-ink/15 bg-white px-6 py-3 text-sm font-semibold text-ink transition hover:border-primary/40 hover:text-primary focus:outline-none focus-visible:ring-4 focus-visible:ring-primary/20 sm:w-auto"
      >
        <i class="fa-solid fa-book-open" aria-hidden="true"></i>
        Browse books
      </a>
    </div>

    <!-- helpful links -->
    <div class="mt-14 border-t border-ink/10 pt-8">
      <p class="text-[11px] font-semibold tracking-[0.2em] text-ink/40 uppercase">Popular pages</p>
      <ul class="mt-4 flex flex-wrap items-center justify-center gap-2">
        <li>
          <a
            routerLink="/books"
            class="inline-flex items-center gap-2 rounded-full border border-ink/10 bg-white px-3.5 py-1.5 text-xs font-medium text-ink/70 transition hover:border-primary/40 hover:text-primary"
          >
            <i class="fa-solid fa-book text-[10px] text-primary" aria-hidden="true"></i>
            All books
          </a>
        </li>
        <li>
          <a
            routerLink="/categories"
            class="inline-flex items-center gap-2 rounded-full border border-ink/10 bg-white px-3.5 py-1.5 text-xs font-medium text-ink/70 transition hover:border-primary/40 hover:text-primary"
          >
            <i class="fa-solid fa-layer-group text-[10px] text-primary" aria-hidden="true"></i>
            Categories
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            class="inline-flex items-center gap-2 rounded-full border border-ink/10 bg-white px-3.5 py-1.5 text-xs font-medium text-ink/70 transition hover:border-primary/40 hover:text-primary"
          >
            <i class="fa-solid fa-circle-info text-[10px] text-primary" aria-hidden="true"></i>
            About us
          </a>
        </li>
        <li>
          <a
            routerLink="/contact"
            class="inline-flex items-center gap-2 rounded-full border border-ink/10 bg-white px-3.5 py-1.5 text-xs font-medium text-ink/70 transition hover:border-primary/40 hover:text-primary"
          >
            <i class="fa-solid fa-envelope text-[10px] text-primary" aria-hidden="true"></i>
            Contact
          </a>
        </li>
      </ul>
    </div>
  </div>
</section>
