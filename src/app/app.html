<!-- navbar -->
<app-navbar></app-navbar>

<!-- sections -->
<main class="mb-22">
  <router-outlet></router-outlet>
</main>
<!-- sections -->

<!-- footer -->
<app-footer></app-footer>


<!-- spiner loading -->
<ngx-spinner
  bdColor="rgba(0,0,0,0.8)"
  [fullScreen]="true"
  [zIndex]="99999"
  [showSpinner]="false"
>
  <div class="flex flex-col items-center gap-3">
    <img src="/assets/logo.svg" alt="Logo" width="100" />

    <span
      class="flex items-center gap-1 font-display text-2xl font-bold text-white tracking-tight"
    >
      Book
      <span
        class="grid place-items-center w-2 h-2 rounded-full bg-secondary"
      >
        <svg class="w-4 h-4 text-white" ...>...</svg>
      </span>
      <span class="text-secondary">Haven</span>
    </span>

    <span
      class="hidden sm:block rounded-full text-[10px] tracking-[0.2em] uppercase text-ink p-1 mt-1 bg-surface"
    >
      Your next great read
    </span>
  </div>
</ngx-spinner>
<!-- spiner loading -->
